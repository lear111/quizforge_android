<main class="short-answer-card">
  <header class="question-header"><span class="question-type">简答题</span><span id="total-score" class="question-score"></span></header>
  <div id="material" class="material" hidden></div>
  <div id="parts" class="parts"></div>
  <div class="actions">
    <button id="submit" class="primary" type="button" data-qf-action="submit" disabled>提交</button>
    <button id="retry" class="secondary" type="button" data-qf-action="retry" hidden>重做</button>
  </div>
  <p id="error" class="error" role="alert" hidden></p>
</main>
