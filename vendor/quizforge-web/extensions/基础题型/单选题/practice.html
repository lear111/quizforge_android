<main class="single-choice-card">
  <header class="question-header">
    <span class="question-type">单选题</span>
    <span id="max-score" class="question-score"></span>
  </header>
  <div id="stem" class="stem"></div>
  <div id="options" class="options" role="radiogroup" aria-label="选择答案"></div>
  <div class="actions">
    <button id="submit" class="primary" type="button" data-qf-action="submit" disabled>提交</button>
    <button id="retry" class="secondary" type="button" data-qf-action="retry" hidden>重做</button>
  </div>
  <section id="result" class="result" hidden>
    <div id="score-value" class="score-value"></div><div class="section-label">答案与解析</div>
    <div id="answer-and-explanation"></div>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
</main>
