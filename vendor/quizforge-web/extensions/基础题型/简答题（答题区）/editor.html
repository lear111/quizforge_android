<main class="short-answer-card authoring">
  <header class="question-header"><span class="question-type">简答题</span><span id="total-score" class="question-score"></span></header>
  <section id="material-section" class="edit-section" hidden>
    <div class="edit-heading"><span class="section-label">共享材料</span><button id="remove-material" class="remove-item" type="button" aria-label="移除共享材料">×</button></div>
    <div id="edit-material" class="editable-field" tabindex="0" role="button" aria-label="编辑共享材料"></div>
  </section>
  <button id="add-material" class="text-action add-material" type="button">＋ 添加共享材料</button>
  <div id="part-editors" class="parts"></div>
  <button id="add-part" class="text-action" type="button">＋ 添加小问</button>
  <p id="error" class="error" role="alert" hidden></p>
</main>
