<main class="card">
  <header><span>简答题 · 文字／手写</span><strong id="maximum"></strong></header>
  <h2 id="title"></h2><p id="stem"></p>
  <div id="areas"></div>
  <p id="status" role="status"></p>
  <div class="actions"><button id="submit" data-qf-action="submit">提交答案</button><button id="retry" data-qf-action="retry">重新作答</button><button id="grade">AI 评分／重试</button></div>
  <section id="result" hidden><h3>作答结果</h3><strong id="score"></strong><p id="feedback"></p><p id="reference"></p></section>
  <div id="manual" hidden><label>人工评分 <input id="manual-score" type="number" min="0" step="0.5" required></label><button type="button" id="manual-save">保存评分</button></div>
</main>
